<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ajib Coffee</title>
    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/lupa_katasandi.css">
    <link rel="stylesheet" href="ASSETS/font/BricolageGrotesque-VariableFont_opsz,wdth,wght.ttf">
</head>

<body>

    <main class="login-page">

        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-md navbar-light custom-navbar">
            <div class="container-fluid px-4 px-lg-5">

                <a class="navbar-brand brand-logo" href="#">
                    <img
                        src="../ASSETS/img/ajib_logo2.png"
                        alt="Logo Ajib Coffee"
                    >
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarAjib"
                    aria-controls="navbarAjib"
                    aria-expanded="false"
                    aria-label="Buka navigasi"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div
                    class="collapse navbar-collapse"
                    id="navbarAjib"
                >
                    <ul class="navbar-nav ms-auto align-items-md-center nav-menu">

                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">
                                Beranda
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about_us.html">
                                Tentang
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link cart-link"
                                href="..index.html"
                                aria-label="Keranjang belanja"
                            >
                                <i class="bi bi-cart3"></i>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="btn btn-register-nav active"
                                aria-current="page"
                            >
                                Masuk
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>

        <!-- KONTEN UTAMA -->
        <section class="register-content">

            <!-- BAGIAN FOTO -->
            <div class="hero-panel">

                <img
                    src="../ASSETS/img/bg-ajib.png"
                    alt="Kopi Ajib Coffee"
                    class="hero-image"
                >

                <!-- Lapisan gelap agar tulisan lebih terbaca -->
                <div class="hero-overlay"></div>

                    <p class="hero-footer">
                        Ajib Coffee &nbsp; | &nbsp; Kopkar Polindra
                    </p>

                </div>
            </div>

            <!-- BAGIAN FORM -->
            <div class="form-panel">

                <div class="register-card">

                    <div class="card-heading">
                        <h2>Ubah Kata Sandi</h2>
                    </div>

                    <div class="card-body-custom">

                      <form     
    id="forgotPasswordForm"
    action="../PHP/forgotPassword.php"
    method="POST"
>


                            <div class="form-group-custom">
                                <label
                                    for="email"
                                    class="visually-hidden"
                                >
                                    Email
                                </label>

                                <input
                                    type="text"
                                    id="email"
                                    name="email"
                                    class="form-control custom-input"
                                    placeholder="Masukkan email"
                                    autocomplete="username"
                                    required
                                >

                                <small class="field-error" id="emailError"></small>
                            </div>
                

                           
                            <div
                                class="alert alert-danger form-alert"
                                id="formAlert"
                                role="alert"
                                hidden
                            ></div>

                            <div
                                class="alert alert-success form-alert"
                                id="formSuccess"
                                role="status"
                                hidden
                            ></div>
                            <div class="lupapw">
                                <a href="../index.html">Coba cara lain?</a>
                            </div>
                            

                            <button
                                type="submit"
                                class="btn btn-submit"
                            >
                                Kirim verifikasi
                            </button>

                        </form>


                        <div class="card-branding">

                            <img
                                src="../ASSETS/img/ajib_logo2.png"
                                alt="Ajib Coffee"
                                class="footer-logo"
                            >

                            <div class="partner-brand">
                                <img
                                src="../ASSETS/img/Logo kopkar.jpeg"
                                alt="Ajib Coffee"
                                class="footer-logo"
                            >
                            </div>

                        </div>

                    </div>
                </div>

            </div>

        </section>

    </main>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Custom JavaScript -->
    <script src="index.js?v=2"></script>

</body>
</html>
