<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi | Ajib Coffee</title>
    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/register.css">
    <link rel="stylesheet" href="../ASSETS/font/BricolageGrotesque-VariableFont_opsz,wdth,wght.ttf">
</head>

<body>

    <main class="register-page">

        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-md navbar-light custom-navbar">
            <div class="container-fluid px-4 px-lg-5">

                <a class="navbar-brand brand-logo" href="#">
                    <img
                        src="../ASSETS/img/ajib_logo2.png"
                        alt="Logo Ajib Coffee"
                    >
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarAjib"
                    aria-controls="navbarAjib"
                    aria-expanded="false"
                    aria-label="Buka navigasi"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div
                    class="collapse navbar-collapse"
                    id="navbarAjib"
                >
                    <ul class="navbar-nav ms-auto align-items-md-center nav-menu">

                        <li class="nav-item">
                            <a class="nav-link" href="login.html">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about_us.html">
                                About us
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link cart-link"
                                href="cart.html"
                                aria-label="Keranjang belanja"
                            >
                                <i class="bi bi-cart3"></i>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="btn btn-register-nav active"
                                href="register.html"
                                aria-current="page"
                            >
                                Daftar
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>

        <!-- KONTEN UTAMA -->
        <section class="register-content">

            <!-- BAGIAN FOTO -->
            <div class="hero-panel">

                <img
                    src="../ASSETS/img/bg-ajib.png"
                    alt="Kopi Ajib Coffee"
                    class="hero-image"
                >

                <!-- Lapisan gelap agar tulisan lebih terbaca -->
                <div class="hero-overlay"></div>

                    <p class="hero-footer">
                        Ajib Coffee &nbsp; | &nbsp; Kopkar Polindra
                    </p>

                </div>
            </div>

            <!-- BAGIAN FORM -->
            <div class="form-panel">

                <div class="register-card">

                    <div class="card-heading">
                        <h2>Daftar</h2>
                    </div>

                    <div class="card-body-custom">

                        <form id="registerForm" action="../PHP/loadRegis.php" method="post" novalidate>

                            <div class="form-group-custom">
                                <label
                                    for="email"
                                    class="visually-hidden"
                                >
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control custom-input"
                                    placeholder="Masukkan email"
                                    autocomplete="email"
                                    required
                                >

                                <small class="field-error" id="emailError"></small>
                            </div>

                            <div class="form-group-custom">
                                <label
                                    for="password"
                                    class="visually-hidden"
                                >
                                    Password
                                </label>

                                <div class="password-wrapper">
                                    <input
                                        type="password"
                                        id="password"
                                        name="password"
                                        class="form-control custom-input"
                                        placeholder="Password"
                                        autocomplete="new-password"
                                        minlength="8"
                                        required
                                    >

                                    <button
                                        type="button"
                                        class="toggle-password"
                                        data-target="password"
                                        aria-label="Tampilkan password"
                                    >
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>

                                <small class="field-error" id="passwordError"></small>
                            </div>

                            <div class="password-hint">
                                Masukkan kembali password anda:
                            </div>

                            <div class="form-group-custom">
                                <label
                                    for="confirmPassword"
                                    class="visually-hidden"
                                >
                                    Konfirmasi password
                                </label>

                                <div class="password-wrapper">
                                    <input
                                        type="password"
                                        id="confirmPassword"
                                        name="confirm_password"
                                        class="form-control custom-input"
                                        placeholder="Konfirmasi password"
                                        autocomplete="new-password"
                                        required
                                    >

                                    <button
                                        type="button"
                                        class="toggle-password"
                                        data-target="confirmPassword"
                                        aria-label="Tampilkan konfirmasi password"
                                    >
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>

                                <small
                                    class="field-error"
                                    id="confirmPasswordError"
                                ></small>
                            </div>

                            <div
                                class="alert alert-danger form-alert"
                                id="formAlert"
                                role="alert"
                                hidden
                            ></div>

                            <div
                                class="alert alert-success form-alert"
                                id="formSuccess"
                                role="status"
                                hidden
                            ></div>

                            <button
                                type="submit"
                                class="btn btn-submit"
                            >
                                Daftar
                            </button>

                        </form>

                        <div class="card-branding">

                            <img
                                src="../ASSETS/img/ajib_logo2.png"
                                alt="Ajib Coffee"
                                class="footer-logo"
                            >

                            <div class="partner-brand">
                                <img
                                src="../ASSETS/img/Logo kopkar.jpeg"
                                alt="Ajib Coffee"
                                class="footer-logo"
                            >
                            </div>

                        </div>

                    </div>
                </div>

            </div>

        </section>

    </main>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Custom JavaScript -->
    <script src="../JAVASCRIPT/register.js"></script>

</body>
</html>
