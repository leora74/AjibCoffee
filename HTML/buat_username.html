
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buat Username | Ajib Coffee</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/buat_username.css">
</head>

<body>

    <main class="register-page">

        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-md navbar-light custom-navbar">
            <div class="container-fluid px-4 px-lg-5">

                <a class="navbar-brand brand-logo" href="../index.html">
                    <img
                        src="../ASSETS/img/ajib_logo2.png"
                        alt="Logo Ajib Coffee"
                    >
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarAjib"
                    aria-controls="navbarAjib"
                    aria-expanded="false"
                    aria-label="Buka navigasi"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div
                    class="collapse navbar-collapse"
                    id="navbarAjib"
                >
                    <ul class="navbar-nav ms-auto align-items-md-center nav-menu">

                        <li class="nav-item">
                            <a class="nav-link" href="main.html">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about_us.html">
                                About us
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link cart-link"
                                href="cart.html"
                                aria-label="Keranjang belanja"
                            >
                                <i class="bi bi-cart3"></i>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="btn btn-register-nav active"
                                aria-current="page"
                            >
                                Daftar
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>

        <!-- KONTEN UTAMA -->
        <section class="register-content">

            <!-- BAGIAN FOTO -->
            <div class="hero-panel">

                <img
                    src="../ASSETS/img/bg-ajib.png"
                    alt="Americano Ajib Coffee"
                    class="hero-image"
                >

                <div class="hero-overlay"></div>

                <p class="hero-footer">
                    Ajib Coffee &nbsp; | &nbsp; Kopkar Polindra
                </p>

            </div>

            <!-- BAGIAN FORM -->
            <div class="form-panel">

                <div class="register-card">

                    <!-- JUDUL -->
                    <div class="card-heading">
                        <h2>Buat Username</h2>
                    </div>

                    <!-- FORM USERNAME -->
                    <div class="card-body-custom">

                        <form
                            id="usernameForm"
                            action="../PHP/simpanUsername.php"
                            method="POST"
                        >

                            <div class="form-group-custom">

                                <label
                                    for="username"
                                    class="visually-hidden"
                                >
                                    Username
                                </label>

                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-control custom-input"
                                    placeholder="Masukkan username"
                                    autocomplete="username"
                                    minlength="3"
                                    maxlength="30"
                                    required
                                >

                                <small
                                    class="field-error"
                                    id="usernameError"
                                ></small>

                            </div>

                            <!-- PESAN ERROR -->
                            <div
                                class="alert alert-danger form-alert"
                                id="formAlert"
                                role="alert"
                                hidden
                            ></div>

                            <!-- TOMBOL DAFTAR -->
                            <button
                                type="submit"
                                class="btn btn-submit"
                            >
                                Daftar
                            </button>

                        </form>

                        <!-- BRANDING -->
                        <div class="card-branding">

                            <img
                                src="../ASSETS/img/ajib_logo2.png"
                                alt="Ajib Coffee"
                                class="footer-logo"
                            >

                            <div class="partner-brand">
                                <img
                                    src="../ASSETS/img/Logo kopkar.jpeg"
                                    alt="Kopkar Polindra"
                                    class="footer-logo"
                                >
                            </div>

                        </div>

                    </div>
                </div>

            </div>

        </section>

    </main>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="../JAVASCRIPT/buat_username.js"></script>
</body>
</html>
